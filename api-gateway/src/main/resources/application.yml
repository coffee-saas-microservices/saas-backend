server:
  port: ${PORT}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: inventory-service-route
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**, /v3/api-docs/inventory

        - id: identity-service-route
          uri: lb://identity-service
          predicates:
            - Path=/api/users/**, /api/auth/**, /api/membership-ranks/**, /api/system-admin/**, /v3/api-docs/identity

        - id: shop-service-route
          uri: lb://shop-service
          predicates:
            - Path=/api/shops/**, /api/internal/shops/**, /api/subscription-plans/**, /api/subscriptions/**, /v3/api-docs/shop

        - id: employee-service-route
          uri: lb://employee-service
          predicates:
            - Path=/api/employees/**, /api/shift-templates/**, /api/employee/unavailability/**, /api/schedules/**, /v3/api-docs/employee

        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**, /v3/api-docs/payment

        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**, /api/promotions/**, /v3/api-docs/order

        - id: catalog-service-route
          uri: lb://catalog-service
          predicates:
            - Path=/api/categories/**,/api/combo-items/**, /api/product-variants/**, /api/sizes/**,/api/recipes/**, /api/products/**, /api/toppings/**, /v3/api-docs/catalog

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      default-zone: ${EUREKA_SERVER_URL}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Identity Service
        url: /v3/api-docs/identity
      - name: 2. Shop Service
        url: /v3/api-docs/shop
      - name: 3. Employee Service
        url: /v3/api-docs/employee
      - name: 4. Inventory Service
        url: /v3/api-docs/inventory
      - name: 5. Payment Service
        url: /v3/api-docs/payment
      - name: 6. Catalog Service
        url: /v3/api-docs/catalog
      - name: 5. Order Service
        url: /v3/api-docs/order