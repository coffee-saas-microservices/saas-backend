server:
  port: ${PORT}

spring:
  application:
    name: ${APPLICATION_NAME}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?options=-c%20TimeZone=Asia/Ho_Chi_Minh
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  # Chế độ test local: không kết nối Eureka (không cần chạy discovery-server)
  cloud:
    discovery:
      enabled: false

# Chế độ test local: tắt đăng ký Eureka
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

springdoc:
  api-docs:
    path: /v3/api-docs/subscription
  swagger-ui:
    path: /swagger-ui.html
