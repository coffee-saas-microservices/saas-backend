server:
  port: ${PORT}

spring:
  application:
    name: ${APPLICATION_NAME}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?options=-c%20TimeZone=Asia/Ho_Chi_Minh
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

# URL gốc của chính payment-service, dùng để dựng link thanh toán (mock) trả cho client
payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8085}

springdoc:
  api-docs:
    path: /v3/api-docs/payment
  swagger-ui:
    path: /swagger-ui.html
