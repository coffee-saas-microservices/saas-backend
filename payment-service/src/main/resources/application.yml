server:
  port: ${PORT:8085}

spring:
  application:
    name: ${APPLICATION_NAME:payment-service}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment-service}?options=-c%20TimeZone=Asia/Ho_Chi_Minh
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}



springdoc:
  api-docs:
    path: /v3/api-docs/payment
  swagger-ui:
    path: /swagger-ui.html

payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8090}

onepay:
  merchant-id: ${ONEPAY_MERCHANT_ID:TESTONEPAY}
  access-code: ${ONEPAY_ACCESS_CODE:6BEB2546}
  hash-secret: ${ONEPAY_HASH_SECRET:6D0870CDE5F24F34F3915FB0045120DB}
  return-url: ${ONEPAY_RETURN_URL:http://localhost:8080/api/onepay/result}
  api-url: ${ONEPAY_PAYMENT_URL:https://mtf.onepay.vn/paygate/vpcpay.op}
